id = "local.herdr-views"
name = "Herdr Views"
version = "1.0.0"
min_herdr_version = "0.9.0"
description = "fzf views over herdr agents, their GitHub PRs, and the links they mentioned"
platforms = ["linux", "macos"]

# Popups, because a picker is transient and a popup leaves the tiled layout
# alone, so the pane you opened it from stays focused underneath and the refs
# view can scope to it.

[[panes]]
id = "agents"
title = "Agents"
placement = "popup"
width = "90%"
height = "90%"
command = ["./hv", "agents"]

[[panes]]
id = "prs"
title = "PRs"
placement = "popup"
width = "90%"
height = "90%"
command = ["./hv", "prs"]

[[panes]]
id = "refs"
title = "Links"
placement = "popup"
width = "90%"
height = "90%"
command = ["./hv", "refs"]

[[panes]]
id = "tree"
title = "Spaces"
placement = "popup"
width = "70%"
height = "80%"
command = ["./hv", "tree"]

# Keeps the spaces tree and the attention queue current. One-shot: it starts
# the refresher, which stops itself when the server's socket disappears.
[[startup]]
command = ["sh", "annotate-startup.sh"]

# Keys can only target an action, not a pane, so each action asks herdr to open
# the pane it wants.

[[actions]]
id = "open-agents"
title = "Travel to an agent"
command = ["sh", "open.sh", "agents"]

[[actions]]
id = "open-tree"
title = "Spaces, tabs and agents as a tree"
command = ["sh", "open.sh", "tree"]

[[actions]]
id = "open-prs"
title = "My pull requests"
command = ["sh", "open.sh", "prs"]

[[actions]]
id = "open-refs"
title = "Links this agent mentioned"
command = ["sh", "open.sh", "refs"]

# Travel keys. The startup loop records every pane you focus, so these can
# retrace them across tabs and spaces.

[[actions]]
id = "back"
title = "Back to the previous pane"
command = ["./hv", "back"]

[[actions]]
id = "forward"
title = "Forward again"
command = ["./hv", "forward"]

[[actions]]
id = "needs-you"
title = "Go to the agent that needs you most"
command = ["./hv", "needs-you"]
